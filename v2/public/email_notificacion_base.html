<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificación de Nueva Encuesta</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <table style="width: 100%; background-color: #ffffff; border-collapse: collapse;" cellpadding="0" cellspacing="0" border="0">
            <!-- Primera fila: Imagen del cabezal -->
            <tr>
                <td style="padding: 0;">
                    <img src="https://estadistica-capa.org.ar/v2/public/assets/images/head-nueva-encuesta.jpg" alt="Cabezal Notificación" style="width: 100%; height: auto; display: block;" />
                </td>
            </tr>
            <!-- Segunda fila: Contenido -->
            <tr>
                <td style="padding: 30px;">
                    <p>Estimado Socio,</p>
                    <p>&nbsp;</p>
                    <p>Le informamos que una nueva encuesta está disponible en el sistema.</p>
                    <p>&nbsp;</p>
                    <p><strong>Encuesta:</strong> {nombre_encuesta}</p>
                    <p>&nbsp;</p>
                    <p><strong>Período:</strong> {periodo}</p>
                    <p>&nbsp;</p>
                    <p>Por favor, ingrese al sistema para completar la carga de datos.</p>
                    <p>&nbsp;</p>
                    <p><a href="https://estadistica-capa.org.ar/v2/config/{link_acceso}">{link_acceso}</a></p>
                    <p>&nbsp;</p>
                    <p>Saludos cordiales.</p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
